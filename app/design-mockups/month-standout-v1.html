<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Month View, Days Stand Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3F91;--navy-deep:#142C6B;--gold:#D8AE4B;--orange:#F2A65E;--orange-dark:#E08A3C;
    --teal:#3E8FA0;--teal-dark:#2C6E7D;--green:#6FCB55;--paper:#fff;--tint:#EAF1FC;--tint-deep:#DCE8FB;
    --ink:#16193B;--ink-soft:#4A5170;--shadow:0 8px 24px rgba(20,44,107,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--tint);color:var(--ink);font-family:'Nunito',sans-serif;font-size:14px;padding:30px;}
  h1,h3{font-family:'Baloo 2',sans-serif;font-weight:700;margin:0;}

  .month-card{background:var(--paper);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);max-width:820px;margin:0 auto;}
  .month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .month-head h3{font-size:18px;}
  .month-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;color:var(--ink-soft);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--tint);}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}

  .month-day{
    aspect-ratio:1/0.8;border-radius:10px;cursor:pointer;padding:6px 7px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:transparent;border:1.5px solid transparent;transition:transform .1s ease;
  }
  .month-day.empty{visibility:hidden;}
  .month-day:not(.empty):hover{transform:translateY(-1px);}

  /* the actual "stand out more" fix: a real tinted background + bold colored number, not just a dot */
  .month-day.has-class{background:rgba(62,143,160,0.12);}
  .month-day.has-class .month-day-num{color:var(--teal-dark);font-weight:800;}
  .month-day.has-soccer{background:rgba(31,63,145,0.09);}
  .month-day.has-soccer .month-day-num{color:var(--navy);font-weight:800;}
  .month-day.has-multiple{background:rgba(180,91,199,0.14);}
  .month-day.has-multiple .month-day-num{color:#8E3F9E;font-weight:800;}
  .month-day.has-holiday{background:rgba(216,174,75,0.16);}
  .month-day.has-holiday .month-day-num{color:#9C7A29;font-weight:800;}

  .month-day.today{border-color:var(--navy);}
  .month-day.selected{outline:2px solid var(--navy);outline-offset:-2px;}

  .month-day-num{font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;color:var(--ink);}
  .month-dots{display:flex;gap:3px;align-self:flex-end;}
  .month-dot{width:6px;height:6px;border-radius:50%;}

  .month-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--tint);}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .legend-swatch{width:14px;height:14px;border-radius:5px;flex:none;}
</style>
</head>
<body>

<div class="month-card">
  <div class="month-head"><h3>September 2026</h3></div>
  <div class="month-weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
  <div class="month-grid" id="grid"></div>
  <div class="month-legend">
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(62,143,160,0.12);"></span>Wellness day</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(31,63,145,0.09);"></span>Soccer day</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(180,91,199,0.14);"></span>Multiple programs</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(216,174,75,0.16);"></span>Holiday</div>
  </div>
</div>

<script>
  const CLASSES = { 16: ['wellness'], 23: ['wellness'], 9: ['soccer'], 30: ['wellness','soccer'] };
  const HOLIDAYS = { 7: 'Labor Day' };
  const TODAY = 16;

  const grid = document.getElementById('grid');
  const firstDay = 2, daysInMonth = 30; // Sep 2026 starts on Tuesday
  for(let i=0;i<firstDay;i++){ const e=document.createElement('div'); e.className='month-day empty'; grid.appendChild(e); }
  for(let d=1; d<=daysInMonth; d++){
    const cell = document.createElement('div');
    const progs = CLASSES[d] || [];
    let cls = 'month-day';
    if(HOLIDAYS[d]) cls += ' has-holiday';
    else if(progs.length > 1) cls += ' has-multiple';
    else if(progs.includes('wellness')) cls += ' has-class';
    else if(progs.includes('soccer')) cls += ' has-soccer';
    if(d === TODAY) cls += ' today';
    cell.className = cls;

    const dots = progs.map(p => `<span class="month-dot" style="background:${p==='wellness'?'#3E8FA0':'#1F3F91'}"></span>`).join('');
    const holidayDot = HOLIDAYS[d] ? `<span class="month-dot" style="background:var(--gold)"></span>` : '';
    cell.innerHTML = `<span class="month-day-num">${d}</span><div class="month-dots">${dots}${holidayDot}</div>`;

    cell.addEventListener('click', () => {
      document.querySelectorAll('.month-day').forEach(c=>c.classList.remove('selected'));
      cell.classList.add('selected');
    });
    grid.appendChild(cell);
  }
</script>

</body>
</html>
