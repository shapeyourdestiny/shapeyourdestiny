<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Month View, Compact + Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3F91;--navy-deep:#142C6B;--gold:#D8AE4B;--orange:#F2A65E;--orange-dark:#E08A3C;
    --teal:#3E8FA0;--teal-dark:#2C6E7D;--paper:#fff;--tint:#EAF1FC;--tint-deep:#DCE8FB;
    --ink:#16193B;--ink-soft:#4A5170;--shadow:0 8px 24px rgba(20,44,107,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--tint);color:var(--ink);font-family:'Nunito',sans-serif;font-size:14px;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif;font-weight:700;margin:0;}

  .page{max-width:1200px;margin:0 auto;padding:28px 28px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  .topbar h1{font-size:22px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .view-toggle{display:flex;gap:4px;background:var(--paper);border-radius:11px;padding:4px;box-shadow:var(--shadow);}
  .view-btn{border:none;background:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12.5px;color:var(--ink-soft);}
  .view-btn.active{background:var(--navy);color:#fff;}
  .add-btn{display:flex;align-items:center;gap:6px;background:var(--orange);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;}
  .manage-btn{display:flex;align-items:center;gap:6px;background:var(--paper);border:none;border-radius:999px;padding:9px 16px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:var(--shadow);}

  .month-wrap{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start;}
  @media(max-width:760px){.month-wrap{grid-template-columns:1fr;}}

  .month-card{background:var(--paper);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);}
  .month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .month-head h3{font-size:16px;}
  .month-nav-btn{background:var(--tint);border:none;border-radius:9px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);}

  .month-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:var(--ink-soft);margin-bottom:6px;}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .month-day{
    aspect-ratio:1/0.78;border-radius:9px;background:var(--tint);cursor:pointer;
    padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;
    transition:background .12s ease;
  }
  .month-day.empty{background:none;cursor:default;}
  .month-day:not(.empty):hover{background:var(--tint-deep);}
  .month-day.today{background:var(--navy);}
  .month-day.today .month-day-num{color:#fff;}
  .month-day.selected{outline:2px solid var(--navy);outline-offset:-2px;}
  .month-day-num{font-family:'Nunito',sans-serif;font-weight:800;font-size:11.5px;}
  .month-dots{display:flex;gap:2px;align-self:flex-end;}
  .month-dot{width:5px;height:5px;border-radius:50%;}

  .month-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--tint);}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-soft);}
  .legend-dot{width:7px;height:7px;border-radius:50%;flex:none;}

  .detail-card{background:var(--paper);border-radius:18px;padding:18px;box-shadow:var(--shadow);position:sticky;top:20px;}
  .detail-card h3{font-size:14.5px;margin-bottom:10px;}
  .detail-empty{font-size:12.5px;color:var(--ink-soft);}
  .detail-session{border-bottom:1px solid var(--tint);padding:11px 0;}
  .detail-session:last-child{border-bottom:none;}
  .detail-school{display:flex;align-items:center;gap:6px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;margin-bottom:3px;}
  .detail-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .detail-time{font-size:11.5px;color:var(--ink-soft);margin-bottom:7px;}
  .detail-slots{display:flex;gap:6px;flex-wrap:wrap;}
  .mini-chip{display:flex;align-items:center;gap:5px;background:var(--tint);border-radius:999px;padding:3px 9px 3px 3px;}
  .mini-avatar{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:7.5px;color:#fff;font-family:'Nunito',sans-serif;font-weight:800;}
  .mini-chip span{font-size:10.5px;font-family:'Nunito',sans-serif;font-weight:800;}
  .unstaffed{font-size:11px;color:var(--orange-dark);}
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <h1>Schedule Board</h1>
    <div class="topbar-right">
      <div class="view-toggle">
        <button class="view-btn">Day</button>
        <button class="view-btn">Week</button>
        <button class="view-btn active">Month</button>
        <button class="view-btn">Year</button>
      </div>
      <button class="add-btn">+ Add Class</button>
      <button class="manage-btn">&#9881; Manage</button>
    </div>
  </div>

  <div class="month-wrap">
    <div class="month-card">
      <div class="month-head">
        <button class="month-nav-btn">&lsaquo;</button>
        <h3>August 2026</h3>
        <button class="month-nav-btn">&rsaquo;</button>
      </div>
      <div class="month-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="month-grid" id="monthGrid"></div>
      <div class="month-legend">
        <div class="legend-item"><span class="legend-dot" style="background:#3E8FA0"></span>Youth Wellness</div>
        <div class="legend-item"><span class="legend-dot" style="background:#6FCB55"></span>Soccer</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--orange)"></span>Holiday</div>
      </div>
    </div>

    <div class="detail-card" id="detailCard">
      <h3>Select a day</h3>
      <p class="detail-empty">Click any date to see what's scheduled.</p>
    </div>
  </div>
</div>

<script>
  const SESSIONS = {
    5:  [{ school:'Palmetto Elementary', color:'#3E8FA0', time:'12:00pm\u20132:00pm', slots:[{name:'Heather Swear',color:'#D8AE4B'}, null] }],
    12: [{ school:'Palmetto Elementary', color:'#3E8FA0', time:'12:00pm\u20132:00pm', slots:[{name:'Heather Swear',color:'#D8AE4B'},{name:'James Rivera',color:'#6FCB55'}] },
         { school:'Ruben S. Ayala High', color:'#6FCB55', time:'4:00pm\u20135:30pm', slots:[{name:'Alex Chen',color:'#F2A65E'},{name:'Devon Price',color:'#2B4FA3'}] }],
    19: [{ school:'Palmetto Elementary', color:'#3E8FA0', time:'12:00pm\u20132:00pm', slots:[{name:'Heather Swear',color:'#D8AE4B'}, null] }],
  };
  const HOLIDAYS = { 28: 'Teacher Workday' };
  const TODAY = 26;

  const grid = document.getElementById('monthGrid');
  const firstDay = 6, daysInMonth = 31;
  for(let i=0;i<firstDay;i++){ const e=document.createElement('div'); e.className='month-day empty'; grid.appendChild(e); }
  for(let d=1; d<=daysInMonth; d++){
    const cell = document.createElement('div');
    cell.className = 'month-day' + (d===TODAY ? ' today' : '');
    const dots = [];
    if(SESSIONS[d]) SESSIONS[d].forEach(s => dots.push(`<span class="month-dot" style="background:${s.color}"></span>`));
    if(HOLIDAYS[d]) dots.push(`<span class="month-dot" style="background:var(--orange)"></span>`);
    cell.innerHTML = `<span class="month-day-num">${d}</span><div class="month-dots">${dots.join('')}</div>`;
    cell.addEventListener('click', () => {
      document.querySelectorAll('.month-day').forEach(c=>c.classList.remove('selected'));
      cell.classList.add('selected');
      const panel = document.getElementById('detailCard');
      const label = `August ${d}, 2026`;
      if(HOLIDAYS[d]){
        panel.innerHTML = `<h3>${label}</h3><p style="font-family:'Baloo 2',sans-serif;font-weight:700;color:var(--orange-dark);font-size:13px;margin-bottom:4px;">${HOLIDAYS[d]}</p><p class="detail-empty">No sessions scheduled.</p>`;
      } else if(SESSIONS[d]){
        panel.innerHTML = `<h3>${label}</h3>` + SESSIONS[d].map(s => `
          <div class="detail-session">
            <div class="detail-school"><span class="detail-dot" style="background:${s.color}"></span>${s.school}</div>
            <div class="detail-time">${s.time}</div>
            <div class="detail-slots">
              ${s.slots.map(inst => inst
                ? `<div class="mini-chip"><div class="mini-avatar" style="background:${inst.color}">${inst.name.split(' ').map(w=>w[0]).join('')}</div><span>${inst.name}</span></div>`
                : ''
              ).join('') || ''}
              ${s.slots.some(x=>!x) ? `<span class="unstaffed">1 slot open</span>` : ''}
            </div>
          </div>`).join('');
      } else {
        panel.innerHTML = `<h3>${label}</h3><p class="detail-empty">Nothing scheduled.</p>`;
      }
    });
    grid.appendChild(cell);
  }
</script>

</body>
</html>
